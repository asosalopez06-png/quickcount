<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quick Count</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#6b7280;--acc:#1f6feb;--ok:#1a7f37;--bad:#c62828;--line:#e3e6ea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1114;--card:#1a1d22;--ink:#f1f3f5;--mute:#9aa3ad;--line:#2b3037}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px 90px}
h1{font-size:20px;margin:14px 0 4px}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:600}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.bad{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.name{font-size:24px;font-weight:700;line-height:1.2;margin:4px 0 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
.row label{font-weight:600;min-width:90px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:56px;height:56px;font-size:28px;padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.step input{width:84px;height:56px;font-size:26px;text-align:center;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.total{font-size:44px;font-weight:800;text-align:center;margin:8px 0}
.flag{text-align:center;font-weight:700;padding:8px;border-radius:10px}
.flag.bad{background:#fde2e2;color:var(--bad)}.flag.ok{color:var(--ok)}
.mute{color:var(--mute);font-size:14px}
textarea{width:100%;min-height:150px;font:15px ui-monospace,monospace;border-radius:12px;border:1px solid var(--line);padding:10px;background:var(--card);color:var(--ink)}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--acc)}
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px}
.nav button{flex:1;padding:16px}
.li{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}
.li b{font-variant-numeric:tabular-nums}
.hide{display:none}
input[type=search],input.txt{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
</style></head><body>
<div id="app"></div>
<script>
const K='quickcount.v1';
let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{items:[],i:0,view:'setup'};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const n=v=>(v===''||v==null||isNaN(+v))?0:+v;
const total=it=>(it.cases===''&&it.loose==='')?null:n(it.cases)*n(it.upc)+n(it.loose);
const expected=it=>(it.last===''||it.last==null)?null:n(it.last)+n(it.recv);
const flag=it=>{const t=total(it);if(t==null)return'';if(n(it.cases)>0&&!n(it.upc))return'need';const e=expected(it);if(e==null)return'';return t>e+Math.max(3,.25*e)?'bad':'ok'};
const usage=it=>{const t=total(it),e=expected(it);return(t==null||e==null)?null:e-t};
const orderQty=it=>{const t=total(it);if(t==null||it.par==='')return 0;const need=Math.max(0,n(it.par)-t);return n(it.upc)>1?Math.ceil(need/n(it.upc)):need};
function parse(txt){
  const num=x=>x!==undefined&&x!==''&&!isNaN(+x)?+x:'';
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    // Full format (paste from Excel, tab-separated): name, units per case, last count, par, supplier
    // Short format (commas): name, units per case, last count
    const p=l.includes('\t')?l.split('\t').map(x=>x.trim()):l.split(/;|,(?=\s*\d+\s*(?:,|$))/).map(x=>x.trim());
    return{name:p[0],upc:num(p[1]),last:num(p[2]),par:num(p[3]),sup:(p[4]||'').trim(),note:(p[5]||'').trim(),sec:(p[6]||'').trim(),recv:'',cases:'',loose:'',skip:false};
  }).filter(x=>x.name&&!/^(product|item)$/i.test(x.name));
}
function setup(){
  $('#app').innerHTML=`<h1>Quick Count</h1>
  <p class="mute">Your list stays on this phone only. Nothing is sent anywhere.</p>
  <div class="card"><b>1. Paste your product list</b>
  <p class="mute">One product per line, in the order you walk the shelves. Optional extras. Short form: <i>Boréale, 24, 80</i> (units per case, last count). Full form, copied from Excel columns: name, units per case, last count, par (how many you want on hand), supplier, order deadline note, section (wine, beer...).</p>
  <textarea id="txt" placeholder="Boréale, 24, 80&#10;Heineken, 24&#10;Don Simon 1L rouge, 6"></textarea>
  <div class="bar"><button id="imp">Load list</button><label class="btn alt">Load CSV file<input type="file" id="f" accept=".csv,.txt" hidden></label></div></div>
  ${S.items.length?`<div class="card"><b>${S.items.length} products loaded</b><div class="bar"><button id="go">Continue counting</button><button class="alt" id="clr">Clear counts</button><button class="bad" id="del">Delete list</button></div></div>`:''}`;
  $('#imp').onclick=()=>{const it=parse($('#txt').value);if(!it.length)return alert('Paste at least one product.');S.items=it;S.i=0;S.view='count';save();render()};
  $('#f').onchange=e=>{const r=new FileReader();r.onload=()=>{$('#txt').value=r.result};r.readAsText(e.target.files[0])};
  if($('#go'))$('#go').onclick=()=>{S.view='count';save();render()};
  if($('#clr'))$('#clr').onclick=()=>{if(confirm('Erase all counts (keep the list)?')){S.items.forEach(x=>{x.cases='';x.loose=''});S.i=0;save();render()}};
  if($('#del'))$('#del').onclick=()=>{if(confirm('Delete the whole list?')){S.items=[];save();render()}};
}
function live(){return S.items.filter(x=>!x.skip)}
function count(){
  const L=S.items;if(!L.length){S.view='setup';return render()}
  S.i=Math.max(0,Math.min(S.i,L.length-1));const it=L[S.i];
  const done=L.filter(x=>x.skip||total(x)!=null).length;
  const t=total(it),f=flag(it);
  $('#app').innerHTML=`<div class="bar"><button class="alt" id="menu">☰ Menu</button><button class="alt" id="list">List</button><button class="alt" id="exp">Finish</button><button id="tk">🎤 Talk</button></div>
  <div class="mute">${S.i+1} of ${L.length} · ${done} done</div><div class="prog"><i style="width:${100*done/L.length}%"></i></div>
  <div class="card">${it.sec?`<div class="mute">${esc(it.sec)}</div>`:''}<div class="name">${esc(it.name)}</div>
  ${it.last!==''?`<div class="mute">Last count: ${it.last}${it.par!==''?' · Par: '+it.par:''}${it.sup?' · '+esc(it.sup):''}</div>`:(it.sup?`<div class="mute">${esc(it.sup)}</div>`:'')}
  <div class="row"><label>Received this week</label><div class="step"><input id="recv" type="number" inputmode="numeric" value="${it.recv}" placeholder="0"></div></div>
  <div class="row"><label>Units per case</label><div class="step"><input id="upc" type="number" inputmode="numeric" value="${it.upc}" placeholder="24"></div></div>
  <div class="row"><label>Cases</label><div class="step"><button data-f="cases" data-d="-1">−</button><input id="cases" type="number" inputmode="numeric" value="${it.cases}" placeholder="0"><button data-f="cases" data-d="1">+</button></div></div>
  <div class="row"><label>Loose</label><div class="step"><button data-f="loose" data-d="-1">−</button><input id="loose" type="number" inputmode="numeric" value="${it.loose}" placeholder="0"><button data-f="loose" data-d="1">+</button></div></div>
  <div class="total" id="tot">${t==null?'–':t}</div>
  <div id="fl">${fl(f)}</div>
  <div class="bar"><button class="alt" id="zero">Zero (none on shelf)</button><button class="alt" id="skip">Don't carry</button></div></div>
  <div class="nav"><button class="alt" id="prev">‹ Back</button><button id="next">Next ›</button></div>`;
  const upd=()=>{it.upc=$('#upc').value;it.recv=$('#recv').value;it.cases=$('#cases').value;it.loose=$('#loose').value;save();$('#tot').textContent=total(it)==null?'–':total(it);$('#fl').innerHTML=fl(flag(it))};
  ['upc','recv','cases','loose'].forEach(id=>$('#'+id).oninput=upd);
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const e=$('#'+b.dataset.f);e.value=Math.max(0,n(e.value)+ +b.dataset.d);upd()});
  $('#zero').onclick=()=>{it.cases='0';it.loose='0';save();go(1)};
  $('#skip').onclick=()=>{it.skip=true;save();go(1)};
  $('#next').onclick=()=>go(1);$('#prev').onclick=()=>go(-1);
  $('#menu').onclick=()=>{S.view='setup';render()};$('#list').onclick=()=>{S.view='list';render()};$('#exp').onclick=()=>{S.view='done';render()};$('#tk').onclick=()=>{S.view='talk';render()};
}
const fl=f=>f==='bad'?'<div class="flag bad">More than expected (last + received): RECOUNT</div>':f==='need'?'<div class="flag bad">Fill units per case</div>':f==='ok'?'<div class="flag ok">Looks right ✓</div>':'';
function go(d){S.i+=d;if(S.i>=S.items.length){S.i=S.items.length-1;S.view='done'}save();render()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function list(){
  $('#app').innerHTML=`<div class="bar"><button class="alt" id="back">‹ Counting</button></div><input type="search" id="q" placeholder="Search product">
  <div id="ls"></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase();let html='',cur=null;
    const stat={};S.items.forEach(x=>{const k=x.sec||'';stat[k]=stat[k]||[0,0];if(!x.skip){stat[k][1]++;if(total(x)!=null)stat[k][0]++}});
    S.items.forEach((it,i)=>{if(!it.name.toLowerCase().includes(q))return;const k=it.sec||'';
      if(k!==cur){cur=k;if(k)html+=`<div class="li" style="background:var(--card);font-weight:700"><span>${esc(k)}</span><span class="mute">${stat[k][0]}/${stat[k][1]} done</span></div>`}
      const t=total(it);html+=`<div class="li" data-i="${i}"><span>${esc(it.name)}${it.skip?' <span class=mute>(not carried)</span>':''}${flag(it)==='bad'?' ⚠️':''}</span><b>${it.skip?'':t==null?'–':t}</b></div>`});
    $('#ls').innerHTML=html;
    document.querySelectorAll('.li[data-i]').forEach(e=>e.onclick=()=>{S.i=+e.dataset.i;S.items[S.i].skip=false;S.view='count';save();render()})};
  $('#q').oninput=draw;draw();$('#back').onclick=()=>{S.view='count';render()};
}
function done(){
  const rows=S.items.filter(x=>!x.skip);
  const missing=rows.filter(x=>total(x)==null),recount=rows.filter(x=>flag(x)==='bad'||flag(x)==='need');
  const txt=bySec(rows).map(([k,xs])=>(k?k+'\n':'')+xs.map(x=>x.name+'\t'+(total(x)==null?'':total(x))).join('\n')).join('\n\n');
  $('#app').innerHTML=`<div class="bar"><button class="alt" id="back">‹ Counting</button></div><h1>Finish</h1>
  <div class="card">${missing.length?`<div class="flag bad">${missing.length} not counted yet</div>`:'<div class="flag ok">Everything counted ✓</div>'}
  ${recount.length?`<p><b>Recount these:</b><br>${recount.map(x=>esc(x.name)).join('<br>')}</p>`:''}
  </div>
  <div class="card"><b>Copy your totals</b><p class="mute">Paste into Excel, Notes, or write them on the paper sheet.</p>
  <div class="bar"><button id="copy">Copy product + total</button><button class="alt" id="csv">Download CSV</button></div>
  <button class="alt" id="last" style="margin-top:6px">Save these as "last count" for next time</button></div>
  <div class="card"><b>Order list (par − counted)</b><p class="mute">Needs par numbers in your list. Shown by supplier, in cases when units per case is set.</p>${orderHtml(rows)}<div class="bar"><button class="alt" id="copyo">Copy order list</button></div></div>
  <div class="card"><b>Used since last count</b>${rows.filter(x=>usage(x)!=null).map(x=>`<div class="li"><span>${esc(x.name)}</span><b>${usage(x)}</b></div>`).join('')||'<p class="mute">Shows once you have a last count.</p>'}</div>
  <div class="card"><b>Totals (for the paper sheet)</b>${bySec(rows).map(([k,xs])=>(k?`<p><b>${esc(k)}</b></p>`:'')+xs.map(x=>`<div class="li"><span>${esc(x.name)}</span><b>${total(x)==null?'–':total(x)}</b></div>`).join('')).join('')}</div>`;
  $('#back').onclick=()=>{S.view='count';render()};
  $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(txt);alert('Copied')}catch(e){prompt('Copy this:',txt)}};
  $('#copyo').onclick=async()=>{const t=orderText(rows);try{await navigator.clipboard.writeText(t);alert('Copied')}catch(e){prompt('Copy this:',t)}};
  $('#csv').onclick=()=>{const b=new Blob(['Product,Total\n'+rows.map(x=>'"'+x.name.replace(/"/g,'""')+'",'+(total(x)==null?'':total(x))).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='count-'+new Date().toISOString().slice(0,10)+'.csv';a.click()};
  $('#last').onclick=()=>{if(confirm('Save totals as last count and clear this count?')){S.items.forEach(x=>{const t=total(x);if(t!=null)x.last=t;x.cases='';x.loose='';x.recv=''});S.i=0;S.view='count';save();render()}};
}
function bySec(rows){const o=[],m={};rows.forEach(x=>{const k=x.sec||'';if(!(k in m)){m[k]=[];o.push([k,m[k]])}m[k].push(x)});return o}
function groups(rows){const g={};rows.forEach(x=>{const q=orderQty(x);if(q>0)(g[x.sup||'No supplier']=g[x.sup||'No supplier']||[]).push([x,q])});return g}
function unit(x){return n(x.upc)>1?'case(s)':'unit(s)'}
function orderHtml(rows){const g=groups(rows);const k=Object.keys(g);return k.length?k.map(s=>`<p><b>${esc(s)}</b>${(g[s][0][0].note)?`<br><span class=mute>⏰ ${esc(g[s][0][0].note)}</span>`:''}</p>`+g[s].map(([x,q])=>`<div class="li"><span>${esc(x.name)}</span><b>${q} ${unit(x)}</b></div>`).join('')).join(''):'<p class="mute">Nothing to order (or no par numbers yet).</p>'}
function orderText(rows){const g=groups(rows);return Object.keys(g).map(s=>s+(g[s][0][0].note?' ('+g[s][0][0].note+')':'')+'\n'+g[s].map(([x,q])=>x.name+'\t'+q+' '+unit(x)).join('\n')).join('\n\n')}

// ---------- TALK TO COUNT ----------
const NUMW={zero:0,un:1,une:1,one:1,deux:2,two:2,trois:3,three:3,quatre:4,four:4,cinq:5,five:5,six:6,sept:7,seven:7,huit:8,eight:8,neuf:9,nine:9,dix:10,ten:10,onze:11,eleven:11,douze:12,twelve:12,treize:13,thirteen:13,quatorze:14,fourteen:14,quinze:15,fifteen:15,seize:16,sixteen:16,seventeen:17,eighteen:18,nineteen:19,vingt:20,twenty:20,trente:30,thirty:30,quarante:40,forty:40,cinquante:50,fifty:50,soixante:60,sixty:60,seventy:70,eighty:80,ninety:90,cent:100,hundred:100};
const CASEW=/^(cases?|case|caisses?|boites?|boite|cartons?|flats?|packs?)$/;
const LOOSEW=/^(loose|units?|unites?|unite|seul(?:e|es|s)?|bouteilles?|canettes?|cans?|bottles?|pieces?|pcs?)$/;
const FILL=/^(and|et|plus|avec|total|les|the|of|a|i|have|we|got|j|ai|on|a|there|is|are|il|y|en)$/;
const norm=t=>String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n2=b.length;if(!m)return n2;if(!n2)return m;let p=[...Array(n2+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n2;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n2]}
const sim=(a,b)=>{if(a===b)return 1;const L=Math.max(a.length,b.length);return Math.max(0,1-lev(a,b)/L)};
function parseSpeech(text){
  const toks=norm(text).split(' ').filter(Boolean);const keep=[];let cases=null,loose=null;
  for(let i=0;i<toks.length;i++){
    let v=null,j=i;
    const t=toks[i];
    if(/^\d+$/.test(t)){v=+t;j=i+1}
    else if(t in NUMW){v=NUMW[t];j=i+1;while(j<toks.length&&(toks[j] in NUMW)){const nv=NUMW[toks[j]];if(v>=20&&v%10===0&&nv<10)v+=nv;else if(nv===100)v*=nv;else break;j++}}
    if(v!=null&&(t==='un'||t==='une'||t==='one')&&!(CASEW.test(toks[j]||'')||LOOSEW.test(toks[j]||''))){v=null}
    if(v==null){keep.push(t);continue}
    const u=toks[j]||'';
    if(CASEW.test(u)){cases=(cases||0)+v;i=j}
    else if(LOOSEW.test(u)){loose=(loose||0)+v;i=j}
    else{loose=(loose||0)+v;i=j-1}   // a bare number means units
  }
  const name=keep.filter(w=>!FILL.test(w)&&!CASEW.test(w)&&!LOOSEW.test(w)).join(' ');
  return{name,cases,loose};
}
function rank(q){
  const qt=q.split(' ').filter(Boolean);if(!qt.length)return[];
  const out=S.items.map((it,i)=>{const nt=norm(it.name).split(' ').filter(Boolean);
    let tot=0,w=0;qt.forEach(a=>{const best=Math.max(...nt.map(b=>sim(a,b)));tot+=best*a.length;w+=a.length});
    let cov=0;nt.forEach(b=>{cov+=Math.max(...qt.map(a=>sim(a,b)))});cov/=nt.length;
    return{i,score:(tot/w)*(0.55+0.45*cov)}}).sort((a,b)=>b.score-a.score);
  return out.slice(0,4);
}
let talkLog=[],lang='en',rec=null;
function applyTalk(i,p,text){const it=S.items[i];const before={cases:it.cases,loose:it.loose,skip:it.skip};
  if(p.cases!=null)it.cases=String(n(it.cases)+p.cases);
  if(p.loose!=null)it.loose=String(n(it.loose)+p.loose);
  if(p.cases!=null&&it.loose==='')it.loose='0';if(p.loose!=null&&it.cases==='')it.cases='0';
  it.skip=false;talkLog.unshift({i,before,text,p});save()}
function talk(){
  $('#app').innerHTML=`<div class="bar"><button class="alt" id="back">‹ Counting</button><button class="alt" id="lang">Language: ${lang==='fr'?'Français':'English'}</button></div>
  <h1>Talk to count</h1>
  <p class="mute">Say the product, then the numbers. Examples: "Messorem Get Wavy, 2 cases, 5 loose" · "Heineken 12" · "deux caisses cinq unités Mortalité". A number with no word after it counts as units. Each time you talk, the count is <b>added</b> to what's already there.</p>
  <div class="bar"><button id="mic" style="width:100%;padding:24px;font-size:20px">🎤 Tap and talk</button></div>
  <input class="txt" id="typed" placeholder="…or type it here and press Enter">
  <div id="heard" class="card" style="display:none"></div>
  <h3>Added this session</h3><div id="log"></div>`;
  const drawLog=()=>{$('#log').innerHTML=talkLog.length?talkLog.slice(0,15).map((e,k)=>{const it=S.items[e.i];return`<div class="li"><span>${esc(it.name)}<br><span class="mute">“${esc(e.text)}” → ${e.p.cases!=null?e.p.cases+' case(s) ':''}${e.p.loose!=null?e.p.loose+' unit(s)':''}</span></span><button class="alt" data-u="${k}">Undo</button></div>`}).join(''):'<p class="mute">Nothing yet.</p>';
    document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const e=talkLog.splice(+b.dataset.u,1)[0];const it=S.items[e.i];it.cases=e.before.cases;it.loose=e.before.loose;it.skip=e.before.skip;save();drawLog()})};
  const handle=text=>{const p=parseSpeech(text);const H=$('#heard');H.style.display='block';
    if(p.cases==null&&p.loose==null){H.innerHTML=`<b>Heard:</b> “${esc(text)}”<br><span class="mute">I didn't catch a number. Try again.</span>`;return}
    const m=rank(p.name);if(!m.length){H.innerHTML=`<b>Heard:</b> “${esc(text)}”<br><span class="mute">I didn't catch a product name.</span>`;return}
    const sure=m[0].score>=0.9&&(m.length<2||m[0].score-m[1].score>=0.12);
    if(sure){applyTalk(m[0].i,p,text);H.innerHTML=`✅ <b>${esc(S.items[m[0].i].name)}</b><br><span class="mute">“${esc(text)}” → ${p.cases!=null?p.cases+' case(s) ':''}${p.loose!=null?p.loose+' unit(s)':''}</span>`;drawLog();return}
    H.innerHTML=`<b>Heard:</b> “${esc(text)}” → ${p.cases!=null?p.cases+' case(s) ':''}${p.loose!=null?p.loose+' unit(s)':''}<br><span class="mute">Which product? Tap the right one:</span>`+m.map(c=>`<button class="alt" style="display:block;width:100%;text-align:left;margin:6px 0" data-c="${c.i}">${esc(S.items[c.i].name)}${S.items[c.i].sec?' <span class=mute>· '+esc(S.items[c.i].sec)+'</span>':''}</button>`).join('');
    H.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{applyTalk(+b.dataset.c,p,text);H.innerHTML=`✅ <b>${esc(S.items[+b.dataset.c].name)}</b>`;drawLog()})};
  $('#typed').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){handle(e.target.value.trim());e.target.value=''}};
  $('#back').onclick=()=>{S.view='count';render()};
  $('#lang').onclick=()=>{lang=lang==='fr'?'en':'fr';talk()};
  $('#mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('This phone/browser has no speech recognition. Type it instead.');return}
    if(rec){try{rec.stop()}catch(e){}}
    rec=new SR();rec.lang=lang==='fr'?'fr-CA':'en-CA';rec.interimResults=false;rec.maxAlternatives=1;
    $('#mic').textContent='🔴 Listening… (tap again to stop)';
    rec.onresult=e=>handle(e.results[0][0].transcript);
    rec.onerror=e=>{$('#heard').style.display='block';$('#heard').innerHTML='Mic problem: '+esc(e.error||'unknown')+'. Allow the microphone for this page, or type it instead.'};
    rec.onend=()=>{const m=$('#mic');if(m)m.textContent='🎤 Tap and talk'};
    rec.start()};
  drawLog();
}

function render(){({setup,count,list,done,talk})[S.view]()}
render();
</script></body></html>
