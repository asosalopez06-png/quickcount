<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quick Count</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#0f1720;--mute:#64707d;--acc:#0b6bcb;--acc2:#0a58a8;--ok:#13795b;--bad:#c0392b;--line:#dde3ea;--chip:#e8f0fa;--shadow:0 1px 2px rgba(15,23,32,.06),0 6px 20px rgba(15,23,32,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161c24;--ink:#eef2f6;--mute:#93a0ad;--line:#27303a;--chip:#1e2b3b;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) 16px 110px}
#app{max-width:760px;margin:0 auto}
h1{font-size:26px;letter-spacing:-.4px;margin:10px 0 6px}h3{margin:18px 0 6px}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:650;border:0;border-radius:14px;padding:14px 18px;background:var(--acc);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08);min-height:48px}
button:active{transform:scale(.98);background:var(--acc2)}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.bad{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:12px 0;box-shadow:var(--shadow)}
.name{font-size:28px;font-weight:750;line-height:1.15;letter-spacing:-.4px;margin:6px 0 14px}
.chipsec{display:inline-block;background:var(--chip);color:var(--acc);font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:999px;padding:5px 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
.row label{font-weight:650;min-width:120px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:64px;height:64px;font-size:30px;padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:none}
.step input{width:96px;height:64px;font-size:30px;font-weight:700;text-align:center;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.step input:focus{outline:none;border-color:var(--acc)}
.quick{display:flex;gap:8px;justify-content:flex-end;margin:-6px 0 6px}
.quick button{min-height:40px;padding:6px 14px;font-size:16px;background:var(--chip);color:var(--acc);box-shadow:none;border-radius:999px}
.total{font-size:64px;font-weight:800;text-align:center;margin:10px 0 4px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.totlab{text-align:center;color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.flag{text-align:center;font-weight:700;padding:10px;border-radius:12px;margin:8px 0}
.flag.bad{background:#fde7e4;color:var(--bad)}.flag.ok{background:#e4f5ee;color:var(--ok)}
.mute{color:var(--mute);font-size:15px}
textarea{width:100%;min-height:150px;font:15px ui-monospace,monospace;border-radius:14px;border:1px solid var(--line);padding:12px;background:var(--card);color:var(--ink)}
.prog{height:10px;background:var(--line);border-radius:10px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#27b0a0);border-radius:10px;transition:width .25s}
.nav{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center}
.nav button{flex:1;max-width:370px;padding:18px;font-size:20px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 6px;border-bottom:1px solid var(--line)}
.li b{font-variant-numeric:tabular-nums;font-size:20px}
input[type=search],input.txt,select{width:100%;font:inherit;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top button{min-height:42px;padding:8px 14px;font-size:16px}
.hide{display:none}
</style></head><body>

const n=v=>(v===''||v==null||isNaN(+v))?0:+v;
const total=it=>(it.cases===''&&it.loose==='')?null:n(it.cases)*n(it.upc)+n(it.loose);
const expected=it=>(it.last===''||it.last==null)?null:n(it.last)+n(it.recv);
const flag=it=>{const t=total(it);if(t==null)return'';if(n(it.cases)>0&&!n(it.upc))return'need';const e=expected(it);if(e==null)return'';return t>e+Math.max(3,.25*e)?'bad':'ok'};
const usage=it=>{const t=total(it),e=expected(it);return(t==null||e==null)?null:e-t};
const orderQty=it=>{const t=total(it);if(t==null||it.par==='')return 0;const need=Math.max(0,n(it.par)-t);return n(it.upc)>1?Math.ceil(need/n(it.upc)):need};
function parse(txt){
  const num=x=>x!==undefined&&x!==''&&!isNaN(+x)?+x:'';
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    // Full format (paste from Excel, tab-separated): name, units per case, last count, par, supplier
    // Short format (commas): name, units per case, last count
    const p=l.includes('\t')?l.split('\t').map(x=>x.trim()):l.split(/;|,(?=\s*\d+\s*(?:,|$))/).map(x=>x.trim());
    return{name:p[0],upc:num(p[1]),last:num(p[2]),par:num(p[3]),sup:(p[4]||'').trim(),note:(p[5]||'').trim(),sec:(p[6]||'').trim(),recv:'',cases:'',loose:'',skip:false};
  }).filter(x=>x.name&&!/^(product|item)$/i.test(x.name));
}

async function unlockList(code){
  const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(ENC.iv)},key,b(ENC.ct));
  return new TextDecoder().decode(pt);
}

function bySec(rows){const o=[],m={};rows.forEach(x=>{const k=x.sec||'';if(!(k in m)){m[k]=[];o.push([k,m[k]])}m[k].push(x)});return o}
function groups(rows){const g={};rows.forEach(x=>{const q=orderQty(x);if(q>0)(g[x.sup||'No supplier']=g[x.sup||'No supplier']||[]).push([x,q])});return g}
function unit(x){return n(x.upc)>1?'case(s)':'unit(s)'}
function orderHtml(rows){const g=groups(rows);const k=Object.keys(g);return k.length?k.map(s=>`<p><b>${esc(s)}</b>${(g[s][0][0].note)?`<br><span class=mute>⏰ ${esc(g[s][0][0].note)}</span>`:''}</p>`+g[s].map(([x,q])=>`<div class="li"><span>${esc(x.name)}</span><b>${q} ${unit(x)}</b></div>`).join('')).join(''):'<p class="mute">Nothing to order (or no par numbers yet).</p>'}
function orderText(rows){const g=groups(rows);return Object.keys(g).map(s=>s+(g[s][0][0].note?' ('+g[s][0][0].note+')':'')+'\n'+g[s].map(([x,q])=>x.name+'\t'+q+' '+unit(x)).join('\n')).join('\n\n')}

// ---------- TALK TO COUNT ----------
const NUMW={zero:0,un:1,une:1,one:1,deux:2,two:2,trois:3,three:3,quatre:4,four:4,cinq:5,five:5,six:6,sept:7,seven:7,huit:8,eight:8,neuf:9,nine:9,dix:10,ten:10,onze:11,eleven:11,douze:12,twelve:12,treize:13,thirteen:13,quatorze:14,fourteen:14,quinze:15,fifteen:15,seize:16,sixteen:16,seventeen:17,eighteen:18,nineteen:19,vingt:20,twenty:20,trente:30,thirty:30,quarante:40,forty:40,cinquante:50,fifty:50,soixante:60,sixty:60,seventy:70,eighty:80,ninety:90,cent:100,hundred:100};
const CASEW=/^(cases?|case|caisses?|boites?|boite|cartons?|flats?|packs?)$/;
const LOOSEW=/^(loose|units?|unites?|unite|seul(?:e|es|s)?|bouteilles?|canettes?|cans?|bottles?|pieces?|pcs?)$/;
const FILL=/^(and|et|plus|avec|total|les|the|of|a|i|have|we|got|j|ai|on|a|there|is|are|il|y|en)$/;
const norm=t=>String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n2=b.length;if(!m)return n2;if(!n2)return m;let p=[...Array(n2+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n2;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n2]}
const sim=(a,b)=>{if(a===b)return 1;const L=Math.max(a.length,b.length);return Math.max(0,1-lev(a,b)/L)};
function parseSpeech(text){
  const toks=norm(text).split(' ').filter(Boolean);const keep=[];let cases=null,loose=null;
  for(let i=0;i<toks.length;i++){
    let v=null,j=i;
    const t=toks[i];
    if(/^\d+$/.test(t)){v=+t;j=i+1}
    else if(t in NUMW){v=NUMW[t];j=i+1;while(j<toks.length&&(toks[j] in NUMW)){const nv=NUMW[toks[j]];if(v>=20&&v%10===0&&nv<10)v+=nv;else if(nv===100)v*=nv;else break;j++}}
    if(v!=null&&(t==='un'||t==='une'||t==='one')&&!(CASEW.test(toks[j]||'')||LOOSEW.test(toks[j]||''))){v=null}
    if(v==null){keep.push(t);continue}
    const u=toks[j]||'';
    if(CASEW.test(u)){cases=(cases||0)+v;i=j}
    else if(LOOSEW.test(u)){loose=(loose||0)+v;i=j}
    else{loose=(loose||0)+v;i=j-1}   // a bare number means units
  }
  const name=keep.filter(w=>!FILL.test(w)&&!CASEW.test(w)&&!LOOSEW.test(w)).join(' ');
  return{name,cases,loose};
}
function rank(q){
  const qt=q.split(' ').filter(Boolean);if(!qt.length)return[];
  const out=S.items.map((it,i)=>{const nt=norm(it.name).split(' ').filter(Boolean);
    let tot=0,w=0;qt.forEach(a=>{const best=Math.max(...nt.map(b=>sim(a,b)));tot+=best*a.length;w+=a.length});
    let cov=0;nt.forEach(b=>{cov+=Math.max(...qt.map(a=>sim(a,b)))});cov/=nt.length;
    return{i,score:(tot/w)*(0.55+0.45*cov)}}).sort((a,b)=>b.score-a.score);
  return out.slice(0,4);
}
let talkLog=[],lang='en',rec=null;
function applyTalk(i,p,text){const it=S.items[i];const before={cases:it.cases,loose:it.loose,skip:it.skip};
  if(p.cases!=null)it.cases=String(n(it.cases)+p.cases);
  if(p.loose!=null)it.loose=String(n(it.loose)+p.loose);
  if(p.cases!=null&&it.loose==='')it.loose='0';if(p.loose!=null&&it.cases==='')it.cases='0';
  it.skip=false;talkLog.unshift({i,before,text,p});save()}

    document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const e=talkLog.splice(+b.dataset.u,1)[0];const it=S.items[e.i];it.cases=e.before.cases;it.loose=e.before.loose;it.skip=e.before.skip;save();drawLog()})};
  const handle=text=>{const p=parseSpeech(text);const H=$('#heard');H.style.display='block';
    if(p.cases==null&&p.loose==null){H.innerHTML=`<b>Heard:</b> “${esc(text)}”<br><span class="mute">I didn't catch a number. Try again.</span>`;return}

    H.innerHTML=`<b>Heard:</b> “${esc(text)}” → ${p.cases!=null?p.cases+' case(s) ':''}${p.loose!=null?p.loose+' unit(s)':''}<br><span class="mute">Which product? Tap the right one:</span>`+m.map(c=>`<button class="alt" style="display:block;width:100%;text-align:left;margin:6px 0" data-c="${c.i}">${esc(S.items[c.i].name)}${S.items[c.i].sec?' <span class=mute>· '+esc(S.items[c.i].sec)+'</span>':''}</button>`).join('');
    H.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{applyTalk(+b.dataset.c,p,text);H.innerHTML=`✅ <b>${esc(S.items[+b.dataset.c].name)}</b>`;drawLog()})};
  $('#typed').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){handle(e.target.value.trim());e.target.value=''}};

  $('#back').onclick=()=>{S.view='count';render()};
  $('#lang').onclick=()=>{lang=lang==='fr'?'en':'fr';talk()};
  $('#mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('This phone/browser has no speech recognition. Type it instead.');return}
    if(rec){try{rec.stop()}catch(e){}}
    rec=new SR();rec.lang=lang==='fr'?'fr-CA':'en-US';rec.interimResults=false;rec.maxAlternatives=1;
    $('#mic').textContent='🔴 Listening… (tap again to stop)';
    rec.onresult=e=>handle(e.results[0][0].transcript);
    rec.onerror=e=>{const H=$('#heard');H.style.display='block';const c=e.error||'unknown';
      const help={'not-allowed':'The mic is blocked. On the iPad: <b>Settings → Safari → Microphone → Allow</b> (or tap <b>aA</b> in the address bar → Website Settings → Microphone → Allow). Also turn on <b>Settings → General → Keyboard → Enable Dictation</b>.','service-not-allowed':'Dictation is switched off on this device. Go to <b>Settings → General → Keyboard → Enable Dictation</b>. (A work iPad may have it locked by your company.)','language-not-supported':'This language is not available. Tap the Language button to switch.','no-speech':'I did not hear anything. Tap the mic and talk right away.','audio-capture':'No microphone found.','network':'No internet for speech. Check Wi‑Fi.'}[c]||('Mic problem: '+esc(c));
      H.innerHTML='<b>🎤 '+help+'</b><br><span class="mute">You can still use the <b>🎤 key on the iPad keyboard</b> in the box below — tap the box, tap that little mic, talk, then press <b>Add</b>.</span>'};
    rec.onend=()=>{const m=$('#mic');if(m)m.textContent='🎤 Tap and talk'};
    rec.start()};
  drawLog();
}

function render(){({setup,count,list,done,talk})[S.view]()}
(async()=>{const h=(location.hash||'').replace(/^#/,'').trim();
  if(h&&!S.items.length){
    $('#app').innerHTML='<h1>Quick Count</h1><div class="card"><b>🔒 Unlocking your list…</b><p class="mute">This can take up to 20 seconds on an older iPad. Please wait.</p></div>';
    let msg='';
    try{
      if(!(window.crypto&&crypto.subtle))throw new Error('This browser cannot unlock lists (no secure crypto). Page version 7.');
      const t=await unlockList(h);const it=parse(t);
      if(!it.length)throw new Error('The unlocked list was empty.');
      S.items=it;S.i=0;S.view='count';save();
    }catch(e){msg=(e&&e.message)||String(e)}
    render();
    if(msg){const e=document.querySelector('#perr');if(e)e.textContent='Auto-unlock failed: '+msg+' (Page version 7). Type the passcode below instead.'}
    return;
  }
  render()})();
</script></body></html>
