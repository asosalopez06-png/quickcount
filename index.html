<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quick Count</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171c;--mute:#6b7280;--acc:#1f6feb;--ok:#1a7f37;--bad:#c62828;--line:#e3e6ea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1114;--card:#1a1d22;--ink:#f1f3f5;--mute:#9aa3ad;--line:#2b3037}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 16px 90px}
h1{font-size:20px;margin:14px 0 4px}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:600}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.bad{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.name{font-size:24px;font-weight:700;line-height:1.2;margin:4px 0 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
.row label{font-weight:600;min-width:90px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:56px;height:56px;font-size:28px;padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.step input{width:84px;height:56px;font-size:26px;text-align:center;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.total{font-size:44px;font-weight:800;text-align:center;margin:8px 0}
.flag{text-align:center;font-weight:700;padding:8px;border-radius:10px}
.flag.bad{background:#fde2e2;color:var(--bad)}.flag.ok{color:var(--ok)}
.mute{color:var(--mute);font-size:14px}
textarea{width:100%;min-height:150px;font:15px ui-monospace,monospace;border-radius:12px;border:1px solid var(--line);padding:10px;background:var(--card);color:var(--ink)}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--acc)}
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px}
.nav button{flex:1;padding:16px}
.li{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}
.li b{font-variant-numeric:tabular-nums}
.hide{display:none}
input[type=search],input.txt{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
</style></head><body>
<div id="app"></div>
<script>
const K='quickcount.v1';
let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{items:[],i:0,view:'setup'};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const n=v=>(v===''||v==null||isNaN(+v))?0:+v;
const total=it=>(it.cases===''&&it.loose==='')?null:n(it.cases)*n(it.upc)+n(it.loose);
const flag=it=>{const t=total(it);if(t==null)return'';if(n(it.cases)>0&&!n(it.upc))return'need';if(it.last===''||it.last==null)return'';return Math.abs(t-n(it.last))>Math.max(3,.25*n(it.last))?'bad':'ok'};
function parse(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(/\t|;|,(?=\s*\d+\s*(,|$))/).map(x=>x.trim());
    return{name:p[0],upc:p[1]&&!isNaN(+p[1])?+p[1]:'',last:p[2]&&!isNaN(+p[2])?+p[2]:'',cases:'',loose:'',skip:false};
  }).filter(x=>x.name&&!/^(product|item)$/i.test(x.name));
}
function setup(){
  $('#app').innerHTML=`<h1>Quick Count</h1>
  <p class="mute">Your list stays on this phone only. Nothing is sent anywhere.</p>
  <div class="card"><b>1. Paste your product list</b>
  <p class="mute">One product per line, in the order you walk the shelves. Optional: add units per case and last count, separated by a comma or tab (you can copy straight from Excel).<br>Example: <i>Boréale, 24, 80</i></p>
  <textarea id="txt" placeholder="Boréale, 24, 80&#10;Heineken, 24&#10;Don Simon 1L rouge, 6"></textarea>
  <div class="bar"><button id="imp">Load list</button><label class="btn alt">Load CSV file<input type="file" id="f" accept=".csv,.txt" hidden></label></div></div>
  ${S.items.length?`<div class="card"><b>${S.items.length} products loaded</b><div class="bar"><button id="go">Continue counting</button><button class="alt" id="clr">Clear counts</button><button class="bad" id="del">Delete list</button></div></div>`:''}`;
  $('#imp').onclick=()=>{const it=parse($('#txt').value);if(!it.length)return alert('Paste at least one product.');S.items=it;S.i=0;S.view='count';save();render()};
  $('#f').onchange=e=>{const r=new FileReader();r.onload=()=>{$('#txt').value=r.result};r.readAsText(e.target.files[0])};
  if($('#go'))$('#go').onclick=()=>{S.view='count';save();render()};
  if($('#clr'))$('#clr').onclick=()=>{if(confirm('Erase all counts (keep the list)?')){S.items.forEach(x=>{x.cases='';x.loose=''});S.i=0;save();render()}};
  if($('#del'))$('#del').onclick=()=>{if(confirm('Delete the whole list?')){S.items=[];save();render()}};
}
function live(){return S.items.filter(x=>!x.skip)}
function count(){
  const L=S.items;if(!L.length){S.view='setup';return render()}
  S.i=Math.max(0,Math.min(S.i,L.length-1));const it=L[S.i];
  const done=L.filter(x=>x.skip||total(x)!=null).length;
  const t=total(it),f=flag(it);
  $('#app').innerHTML=`<div class="bar"><button class="alt" id="menu">☰ Menu</button><button class="alt" id="list">List</button><button class="alt" id="exp">Finish</button></div>
  <div class="mute">${S.i+1} of ${L.length} · ${done} done</div><div class="prog"><i style="width:${100*done/L.length}%"></i></div>
  <div class="card"><div class="name">${esc(it.name)}</div>
  ${it.last!==''?`<div class="mute">Last count: ${it.last}</div>`:''}
  <div class="row"><label>Units per case</label><div class="step"><input id="upc" type="number" inputmode="numeric" value="${it.upc}" placeholder="24"></div></div>
  <div class="row"><label>Cases</label><div class="step"><button data-f="cases" data-d="-1">−</button><input id="cases" type="number" inputmode="numeric" value="${it.cases}" placeholder="0"><button data-f="cases" data-d="1">+</button></div></div>
  <div class="row"><label>Loose</label><div class="step"><button data-f="loose" data-d="-1">−</button><input id="loose" type="number" inputmode="numeric" value="${it.loose}" placeholder="0"><button data-f="loose" data-d="1">+</button></div></div>
  <div class="total" id="tot">${t==null?'–':t}</div>
  <div id="fl">${fl(f)}</div>
  <div class="bar"><button class="alt" id="zero">Zero (none on shelf)</button><button class="alt" id="skip">Don't carry</button></div></div>
  <div class="nav"><button class="alt" id="prev">‹ Back</button><button id="next">Next ›</button></div>`;
  const upd=()=>{it.upc=$('#upc').value;it.cases=$('#cases').value;it.loose=$('#loose').value;save();$('#tot').textContent=total(it)==null?'–':total(it);$('#fl').innerHTML=fl(flag(it))};
  ['upc','cases','loose'].forEach(id=>$('#'+id).oninput=upd);
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const e=$('#'+b.dataset.f);e.value=Math.max(0,n(e.value)+ +b.dataset.d);upd()});
  $('#zero').onclick=()=>{it.cases='0';it.loose='0';save();go(1)};
  $('#skip').onclick=()=>{it.skip=true;save();go(1)};
  $('#next').onclick=()=>go(1);$('#prev').onclick=()=>go(-1);
  $('#menu').onclick=()=>{S.view='setup';render()};$('#list').onclick=()=>{S.view='list';render()};$('#exp').onclick=()=>{S.view='done';render()};
}
const fl=f=>f==='bad'?'<div class="flag bad">Far from last count: RECOUNT</div>':f==='need'?'<div class="flag bad">Fill units per case</div>':f==='ok'?'<div class="flag ok">Matches last count ✓</div>':'';
function go(d){S.i+=d;if(S.i>=S.items.length){S.i=S.items.length-1;S.view='done'}save();render()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function list(){
  $('#app').innerHTML=`<div class="bar"><button class="alt" id="back">‹ Counting</button></div><input type="search" id="q" placeholder="Search product">
  <div id="ls"></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase();$('#ls').innerHTML=S.items.map((it,i)=>({it,i})).filter(o=>o.it.name.toLowerCase().includes(q)).map(({it,i})=>{const t=total(it);return`<div class="li" data-i="${i}"><span>${esc(it.name)}${it.skip?' <span class=mute>(not carried)</span>':''}${flag(it)==='bad'?' ⚠️':''}</span><b>${it.skip?'':t==null?'–':t}</b></div>`}).join('');
    document.querySelectorAll('.li').forEach(e=>e.onclick=()=>{S.i=+e.dataset.i;S.items[S.i].skip=false;S.view='count';save();render()})};
  $('#q').oninput=draw;draw();$('#back').onclick=()=>{S.view='count';render()};
}
function done(){
  const rows=S.items.filter(x=>!x.skip);
  const missing=rows.filter(x=>total(x)==null),recount=rows.filter(x=>flag(x)==='bad'||flag(x)==='need');
  const txt=rows.map(x=>x.name+'\t'+(total(x)==null?'':total(x))).join('\n');
  $('#app').innerHTML=`<div class="bar"><button class="alt" id="back">‹ Counting</button></div><h1>Finish</h1>
  <div class="card">${missing.length?`<div class="flag bad">${missing.length} not counted yet</div>`:'<div class="flag ok">Everything counted ✓</div>'}
  ${recount.length?`<p><b>Recount these:</b><br>${recount.map(x=>esc(x.name)).join('<br>')}</p>`:''}
  </div>
  <div class="card"><b>Copy your totals</b><p class="mute">Paste into Excel, Notes, or write them on the paper sheet.</p>
  <div class="bar"><button id="copy">Copy product + total</button><button class="alt" id="csv">Download CSV</button></div>
  <button class="alt" id="last" style="margin-top:6px">Save these as "last count" for next time</button></div>
  <div class="card"><b>Totals (for the paper sheet)</b>${rows.map(x=>`<div class="li"><span>${esc(x.name)}</span><b>${total(x)==null?'–':total(x)}</b></div>`).join('')}</div>`;
  $('#back').onclick=()=>{S.view='count';render()};
  $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(txt);alert('Copied')}catch(e){prompt('Copy this:',txt)}};
  $('#csv').onclick=()=>{const b=new Blob(['Product,Total\n'+rows.map(x=>'"'+x.name.replace(/"/g,'""')+'",'+(total(x)==null?'':total(x))).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='count-'+new Date().toISOString().slice(0,10)+'.csv';a.click()};
  $('#last').onclick=()=>{if(confirm('Save totals as last count and clear this count?')){S.items.forEach(x=>{const t=total(x);if(t!=null)x.last=t;x.cases='';x.loose=''});S.i=0;S.view='count';save();render()}};
}
function render(){({setup,count,list,done})[S.view]()}
render();
</script></body></html>
